# ============================================================
# LOCAL DEV PERSISTENT DATABASE (H2 MySQL Mode)
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/aviradb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console (available at http://localhost:8081/api/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Dev Port (avoids conflict with background Windows service on 8080)
server.port=8081

# Dev JWT Secret
app.jwt.secret=local-dev-only-jwt-secret-not-used-in-production-replace-on-railway
app.jwt.expiration-ms=86400000

# Local CORS (Vite dev server)
app.cors.allowed-origins=http://localhost:5173
