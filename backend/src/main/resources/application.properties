# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/api

# MySQL Database Configuration
# Railway injects MYSQL_PUBLIC_URL, MYSQLUSER, MYSQLPASSWORD automatically
# For local dev, fallback values are used
spring.datasource.url=${MYSQL_PUBLIC_URL:jdbc:mysql://localhost:3306/avirapyrotech_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:mk71771}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Custom File Storage Configuration
app.upload.dir=${UPLOAD_DIR:./uploads}

# Security Configurations
app.jwt.secret=${JWT_SECRET:AviraPyrotechCrackersAdminPanelSuperSecretKey2026!#}
app.jwt.expiration-ms=86400000

# CORS: Allow requests from Vercel frontend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Logging Configuration
logging.level.root=INFO
logging.level.com.avirapyrotech.admin=DEBUG
