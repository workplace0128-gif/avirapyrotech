# ============================================================
# SERVER CONFIGURATION
# ============================================================
# Railway injects PORT automatically
server.port=${PORT:8081}
server.servlet.context-path=/api

# ============================================================
# MYSQL DATABASE CONFIGURATION
# ============================================================
# Railway MySQL plugin injects MYSQL_URL (full JDBC URL), MYSQLUSER, MYSQLPASSWORD
# For local dev, the fallback values below are used.
#
# IMPORTANT: On Railway, set MYSQL_URL from the MySQL plugin reference variable.
# It will look like: jdbc:mysql://HOST:PORT/DBNAME?...
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/avirapyrotech_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${MYSQLUSER:root}
# SECURITY: Do NOT hardcode password here. Set MYSQLPASSWORD as an environment variable.
# Local dev: set MYSQLPASSWORD=your_local_password in your OS environment or in application-local.properties (gitignored)
# Railway production: auto-injected by Railway MySQL plugin
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / HIBERNATE CONFIGURATION
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# FILE UPLOAD CONFIGURATION
# ============================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Custom upload directory (Railway: ephemeral; S3/Cloudinary recommended for production)
app.upload.dir=${UPLOAD_DIR:./uploads}

# ============================================================
# JWT SECURITY CONFIGURATION
# ============================================================
# IMPORTANT: On Railway, set JWT_SECRET environment variable to a strong random string
# (minimum 32 characters). Do NOT use the fallback below in production.
app.jwt.secret=${JWT_SECRET:CHANGE_ME_SET_JWT_SECRET_ENV_VAR_ON_RAILWAY_MIN_32_CHARS}
app.jwt.expiration-ms=86400000

# ============================================================
# CORS CONFIGURATION
# ============================================================
# IMPORTANT: On Railway, set CORS_ALLOWED_ORIGINS to your Vercel URL.
# Example: https://avirapyrotech.vercel.app
# Multiple origins: https://avirapyrotech.vercel.app,https://your-preview.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ============================================================
# LOGGING CONFIGURATION
# ============================================================
logging.level.root=INFO
logging.level.com.avirapyrotech.admin=DEBUG
